[project]
name = "mistral-code-pipeline-worker"
version = "0.1.0"
description = "Worker Mistral Workflows : change request -> boucle dev/tests entre agents -> Merge Request GitLab (deploiement manage Mistral Cloud)."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.19.0",
    "mistralai>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["apps/worker/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/worker/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
